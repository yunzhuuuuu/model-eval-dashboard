name: Process evaluation jobs

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluation-worker
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Check worker secrets
        id: secrets
        shell: bash
        run: |
          if [[ -n "$DATABASE_URL" && -n "$BLOB_READ_WRITE_TOKEN" && -n "$GEMINI_API_KEY" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Scheduled worker is waiting for its repository secrets."
          fi

      - name: Check out repository
        uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'

      - name: Set up Python
        uses: actions/setup-python@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker-requirements.txt

      - name: Restore model cache
        uses: actions/cache@v6
        if: steps.secrets.outputs.ready == 'true'
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch/sentence_transformers
          key: ${{ runner.os }}-sentence-models-v1

      - name: Install worker dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: |
          pip install torch==2.14.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r worker-requirements.txt

      - name: Process queued evaluations
        run: python -m worker --drain --max-items 10
        if: steps.secrets.outputs.ready == 'true'
